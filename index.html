<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweetu ab man bhi jao n!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffe6eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            position: relative;
        }
        h1 {
            color: #ff4d6d;
            font-size: 26px;
            margin-bottom: 15px;
        }
        p {
            color: #555;
            font-size: 18px;
            margin-bottom: 25px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            min-height: 50px;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.4);
        }
        #yesBtn:hover {
            transform: scale(1.1);
        }
        #noBtn {
            background-color: #cccccc;
            color: #333;
            position: absolute;
            left: 55%;
        }
        .hidden-message {
            display: none;
        }
        .hidden-message h2 {
            color: #ff4d6d;
            font-size: 26px;
            margin-top: 15px;
        }
        .emoji {
            font-size: 50px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <div class="emoji">🥺👉👈</div>
        <h1>Sweetu ab man bhi jao n!</h1>
        <p>Gussa khatam karein?</p>
        
        <div class="btn-group">
            <button id="yesBtn" onclick="sayYes()">Yes ❤</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()" ontouchstart="moveButton()">No 😜</button>
        </div>
    </div>

    <div class="card hidden-message" id="successCard">
        <div class="emoji">🎉🥰✨</div>
        <h2>Yayyy! Mujhe pata tha tum maan jaogi! ❤️</h2>
        <p style="margin-top: 15px;">Aage se gussa mat hona please! 😇</p>
    </div>

    <script>
        function moveButton() {
            const noBtn = document.getElementById('noBtn');
            
            const padding = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.floor(Math.random() * (maxX - padding)) + padding;
            const randomY = Math.floor(Math.random() * (maxY - padding)) + padding;

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        function sayYes() {
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('successCard').style.display = 'block';
        }
    </script>
</body>
</html>
